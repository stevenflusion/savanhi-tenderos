# openspec/config.yaml — web-enterprise
schema: spec-driven

context: |
  App: web-enterprise
  Monorepo: Savanhi-App-Monolito- (pnpm + Turborepo)
  Path: apps/Web/web-enterprise
  Stack: Next.js 14.2.3 (Pages Router), React 18.2, TypeScript 5.9.2
  Styling: Tailwind CSS 3.4 with @repo/tailwind-config/web preset + PostCSS/Autoprefixer
  Architecture: Clean Architecture — domain/application/presentation layers with auth feature
  Domain: auth (credentials, validation, session contracts from @repo/api-contracts)
  Application: login-use-case, auth-api (fetch-based), session-store (localStorage)
  Presentation: LoginForm, AuthProvider (React Context), useLoginForm hook, pages/index, pages/dashboard
  Dependencies: @repo/api-contracts (workspace), @repo/tailwind-config (workspace)
  Testing status: No test runner configured — no test files, no test dependencies
  Code quality: Monorepo-level ESLint v9 (flat config via @repo/eslint-config), TypeScript tsc --noEmit via turbo check-types, Prettier v3 formatting

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope changes to specific layers (domain/application/presentation)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect Clean Architecture dependency rule (domain → nothing, application → domain, presentation → application)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (Clean Architecture layers)
    - Use TypeScript strict mode
    - Use Tailwind utility classes for styling
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "pnpm --filter web-enterprise run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  reason: "No test runner detected in web-enterprise package.json or monorepo. Install Vitest or Jest before enabling strict TDD."
  detected: "2026-06-29"
  runner:
    command: ""
    framework: ""
  layers:
    unit:
      available: false
      tool: ""
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "pnpm turbo run lint"
      tool: "ESLint v9 (flat config via @repo/eslint-config)"
    type_checker:
      available: true
      command: "pnpm turbo run check-types"
      tool: "TypeScript 5.9.2 (tsc --noEmit)"
    formatter:
      available: true
      command: "pnpm format (prettier --write)"
      tool: "Prettier v3"
