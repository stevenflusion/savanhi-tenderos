services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: savanhi
      POSTGRES_USER: savanhi
      POSTGRES_PASSWORD: savanhi
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savanhi -d savanhi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
